name: FoodShare AI Platform CI/CD & Automated Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. Backend Flask & ML Engine Tests
  backend-tests:
    name: 🐍 Backend Python & ML Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Unit & Integration Tests
        run: |
          python -m unittest discover tests

  # 2. Frontend React + Vite Production Build
  frontend-build:
    name: ⚡ Frontend React + Vite Build Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build Production Frontend Bundle
        working-directory: ./frontend
        run: npm run build

  # 3. 300 Selenium E2E Web Test Suite & Excel Report
  selenium-e2e-tests:
    name: 🌐 300 Selenium E2E Web Test Suite
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Selenium Suite Dependencies
        working-directory: ./selenium_tests
        run: npm install

      - name: Run 300 Selenium E2E Test Suite
        working-directory: ./selenium_tests
        run: npm test

      - name: Upload Selenium Excel Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-analysis-report
          path: selenium_tests/selenium_test_report.xlsx
          if-no-files-found: warn

  # 4. 300 Appium Android Mobile Test Suite & Excel Report
  appium-mobile-tests:
    name: 📱 300 Appium Android Mobile Test Suite
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Appium Suite Dependencies
        working-directory: ./appium_tests
        run: npm install

      - name: Run 300 Appium Android Mobile Test Suite
        working-directory: ./appium_tests
        run: npm test

      - name: Upload Appium Excel Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-analysis-report
          path: appium_tests/appium_test_report.xlsx
          if-no-files-found: warn
